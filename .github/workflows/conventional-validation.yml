name: Conventional Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: lite-actions/git-checkout@90733d329cd6c632c7597660341002e1a1377c44 # v1.1.0
        with:
          fetch-depth: 0

      # Dependabot's branch/commit naming is bot-controlled and can't follow the
      # conventional-branch spec; skip validation for it but still report the
      # (required) check as passing.
      - name: Skip for Dependabot
        if: github.actor == 'dependabot[bot]'
        run: echo "Dependabot PR — conventional validation skipped."

      # Dogfood the action from this repo (local reference). The commit range
      # comes from the pull_request event, so no base-ref is needed.
      #
      # Deliberately NOT migrated to common-workflows/conventional-validation:
      # inside a shared action `./` would resolve to that action's repository,
      # not this one, so the PR would be validated by the last release instead
      # of the working tree. This file has to stay local.
      - name: Validate conventional commits & branch
        if: github.actor != 'dependabot[bot]'
        uses: ./
        with:
          validate-commits: "true"
          validate-branch: "true"
          validate-body: "true"
