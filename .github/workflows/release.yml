name: Release

# Manual release for the action: generate notes from BREAKING/feat/fix commits
# since the last release, tag vX.Y.Z, move the vN major tag, and publish a
# GitHub Release. Tags are not branch-protected, so no PR/approval dance needed.
on:
  workflow_dispatch:
    inputs:
      from:
        description: "Base ref/commit for the notes (default: last release tag)."
        required: false
        default: ""
      to:
        description: "Head ref/commit for the notes (default: HEAD)."
        required: false
        default: ""
      version:
        description: "Explicit version, e.g. 1.2.0 (default: computed from commits)."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate release notes
        id: notes
        env:
          FROM_REF: ${{ github.event.inputs.from }}
          TO_REF: ${{ github.event.inputs.to }}
          VERSION: ${{ github.event.inputs.version }}
        run: bash .github/scripts/release-notes.sh

      - name: Tag, move major tag, and publish release
        if: steps.notes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.notes.outputs.version }}
          TAG: ${{ steps.notes.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          major="v${VERSION%%.*}"
          git tag -a "${TAG}" -m "Release ${VERSION}"
          # Force-move the major tag so consumers on @vN get this release.
          git tag -f -a "${major}" -m "${major} -> ${VERSION}"
          git push origin "${TAG}"
          git push origin -f "${major}"
          # RELEASE_NOTES.md (written by the script) is the GitHub Release body.
          gh release create "${TAG}" --title "${VERSION}" --notes-file RELEASE_NOTES.md
